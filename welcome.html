<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome | Greg Montez</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 30px;
    }

    .welcome {
      max-width: 650px;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 400;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #bdbdbd;
      margin-bottom: 12px;
    }

    .signature {
      color: #fff;
      margin-top: 25px;
      margin-bottom: 45px;
    }

    a {
      display: inline-block;

      color: #fff;
      text-decoration: none;

      border: 1px solid #fff;
      padding: 14px 28px;

      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;

      transition: 0.3s ease;
    }

    a:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

  <main class="welcome">

    <h1>YOU'RE IN.</h1>

    <p>Welcome to my world.</p>

    <p>
      Thanks for joining me.
      There's a lot more to come.
    </p>

    <p class="signature">— Greg</p>

    <a href="/">RETURN TO GREGMONTEZ.COM</a>

  </main>

</body>
</html>
