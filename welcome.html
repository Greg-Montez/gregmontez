<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Greg Montez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Inter",Arial,sans-serif;background:#07182f;color:#f4f1ec}
body{min-height:100vh;display:grid;place-items:center;padding:40px 24px;position:relative;overflow:hidden}
body::before{
  content:"";position:fixed;inset:0;z-index:0;
  background-image:
    radial-gradient(circle at 50% 20%,rgba(43,108,179,.20),transparent 45%),
    linear-gradient(rgba(2,10,24,.22),rgba(1,7,18,.40)),
    url("blue-texture-bg.jpg");
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.wrap{position:relative;z-index:1;width:min(680px,100%);text-align:center}
.eyebrow{margin:0 0 26px;color:#858585;font-size:10px;font-weight:300;letter-spacing:4px;text-transform:uppercase}
h1{margin:0 0 28px;font-size:clamp(58px,11vw,110px);line-height:.88;letter-spacing:-5px}
p{margin:0 auto 14px;max-width:560px;color:#aaa;font-size:14px;line-height:1.75}
.confirm{color:#f4f1ec;font-size:16px}
.signature{margin-top:25px;font-family:"Caveat",cursive;color:#f4f1ec;font-size:28px}
.button{display:inline-flex;margin-top:30px;padding:14px 20px;border:1px solid #555;color:#f4f1ec;font-size:9px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:.25s}
.button:hover{background:#f4f1ec;color:#07182f;border-color:#f4f1ec}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Almost there</p>
  <h1>YOU'RE IN.</h1>
  <p class="confirm">Check your email for a quick confirmation link to finish signing up.</p>
  <p>Once you confirm, you'll be set to receive new music, track reveals, and updates from me.</p>
  <p class="signature">— Greg</p>
  <a class="button" href="/">Return to gregmontez.com</a>
</main>
</body>
</html>
